name: Diagnose Air China-adgang

# Kun manuel — kør den fra Actions-fanen når du vil vide præcis hvorfor
# Air China-kilden fejler i skyen. Den svarer på ét spørgsmål: bliver vi
# blokeret af bot-beskyttelsen, eller er det noget helt andet?

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        continue-on-error: true
        run: |
          pip install -r requirements-local.txt
          python -m playwright --version
          python -m playwright install --with-deps chromium \
            || python -m playwright install chromium

      # if: always() — også hvis installationen fejlede, for netop DET er
      # en af de mulige forklaringer, diagnosen skal skelne imellem.
      - name: Kør diagnose
        if: always()
        run: python diagnose.py
