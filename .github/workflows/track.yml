name: Daglig flypris-tjek

on:
  schedule:
    # Hver dag kl. 06:00 UTC (= 07:00 dansk vintertid / 08:00 sommertid)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # så du også kan køre den manuelt fra Actions-fanen

permissions:
  contents: write  # så botten kan committe prishistorikken tilbage

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      PRICE_ALERT_THRESHOLD: "8000"
      OUTBOUND_DATE: "2027-03-20"
      RETURN_DATE: "2027-04-10"
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      # --- Kilde 1: Google Flights via SerpApi (stabil, kører altid) ---
      - name: SerpApi-pris og Telegram
        run: python flight_tracker.py

      # --- Kilde 2: airchina.dk — SLÅET FRA i skyen ---
      #
      # Air China kører Imperva/Distil bot-beskyttelse. Verificeret ved at
      # sende søgningen med curl: svaret er deres blokeringsside
      # ("Pardon Our Interruption", med Imperva/Incapsula i kildekoden).
      #
      # Fra en almindelig internetforbindelse i en ægte browser slipper
      # aflæsningen igennem, men GitHub Actions kører på datacenter-IP'er,
      # som er dem beskyttelsen rammer hårdest. Kilden kørte i tre uger og
      # blev derefter lukket ude — det var årsagen til at den stoppede 24/8,
      # ikke en fejl i koden.
      #
      # Vi forsøger IKKE at omgå beskyttelsen. airchina_tracker.py ligger
      # stadig i repoet og virker, når den køres lokalt fra egen maskine.

      - name: Gem prishistorik
        if: always()
        run: |
          git config user.name "flybilletbot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Prisopdatering $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          else
            echo "Ingen ændring i prisdata."
          fi
