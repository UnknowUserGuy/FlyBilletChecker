name: Daglig flypris-tjek

on:
  schedule:
    # Hver dag kl. 06:00 UTC (= 07:00 dansk vintertid / 08:00 sommertid)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # så du også kan køre den manuelt fra Actions-fanen

permissions:
  contents: write  # så botten kan committe prishistorikken tilbage

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      PRICE_ALERT_THRESHOLD: "8000"
      OUTBOUND_DATE: "2027-03-20"
      RETURN_DATE: "2027-04-10"
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      # --- Kilde 1: Google Flights via SerpApi (stabil, kører altid) ---
      - name: SerpApi-pris og Telegram
        run: python flight_tracker.py

      # Tidligere fandtes her en kilde 2, der aflæste airchina.dk direkte.
      # Den er fjernet: Air Chinas Imperva/Distil-beskyttelse afviser
      # GitHubs IP-adresser. Målt fra en runner — selv et almindeligt kald
      # til forsiden blev blokeret, og en ægte browser ligeså, selvom
      # browseren startede fint. Det er altså adressen der er markeret,
      # ikke klienten der genkendes.
      #
      # Koden virkede (49 celler aflæst fra en dansk forbindelse samme
      # dag), men der er ingen lovlig vej til at køre den i skyen, så den
      # blev fjernet frem for at fejle hver morgen. Historikken ligger
      # stadig i data/airchina_prices.csv og data/matrix/.
      # Se git-historikken (df2191d) for hele måleresultatet.

      - name: Gem prishistorik
        if: always()
        run: |
          git config user.name "flybilletbot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Prisopdatering $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          else
            echo "Ingen ændring i prisdata."
          fi
