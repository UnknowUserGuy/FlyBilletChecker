name: Daglig flypris-tjek

on:
  schedule:
    # Hver dag kl. 06:00 UTC (= 07:00 dansk vintertid / 08:00 sommertid)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # så du også kan køre den manuelt fra Actions-fanen

permissions:
  contents: write  # så botten kan committe prishistorikken tilbage

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      PRICE_ALERT_THRESHOLD: "8000"
      OUTBOUND_DATE: "2027-03-20"
      RETURN_DATE: "2027-04-10"
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      # --- Kilde 1: Google Flights via SerpApi (stabil, kører altid) ---
      - name: SerpApi-pris og Telegram
        run: python flight_tracker.py

      # --- Kilde 2: airchina.dk — KAN IKKE køre i skyen ---
      #
      # MÅLT, ikke gættet. Kør diagnose.yml for at gentage målingen.
      # Resultat fra en GitHub-runner:
      #
      #   1. GET airchina.dk (almindelig klient) ....... BLOKERET
      #   2. POST søgningen (almindelig klient) ........ BLOKERET
      #   3. Playwright starter Chromium ............... OK
      #   4. Samme side i en ÆGTE browser .............. BLOKERET
      #
      # At selv trin 1 blokeres, og at trin 4 fejler selvom browseren
      # kører fint (trin 3), viser at det er IP-adressen der er markeret —
      # ikke klienten der genkendes. Air Chinas Imperva/Distil-beskyttelse
      # afviser GitHubs adresseintervaller.
      #
      # Samme kode kørte igennem uden problemer fra en almindelig dansk
      # forbindelse samme dag (49 celler aflæst), så koden fejler ikke.
      # Kilden kørte i tre uger og blev derefter lukket ude — det var det,
      # der skete 24/8.
      #
      # Beskyttelsen forsøges IKKE omgået. airchina_tracker.py ligger
      # stadig i repoet og virker, når den køres lokalt fra egen maskine.

      - name: Gem prishistorik
        if: always()
        run: |
          git config user.name "flybilletbot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Prisopdatering $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          else
            echo "Ingen ændring i prisdata."
          fi
